<div class="mcc-download-menu">
  <div class="tree-export">
    <h2>Export tree as</h2>
    <div class="export-buttons">
      <button type="button" class="export-button" id="export-png">PNG</button>
      <button type="button" class="export-button" id="export-pdf">PDF</button>
    </div>
    <div class="export-options-checkbox">
      <input type="checkbox" id="zoom" name="zoom-area" checked>
      <label for="zoom-area">include zoom area</label>
    </div>
    <div class="export-options-checkbox">
      <input type="checkbox" id="color-by-cred" name="color-by-cred" checked>
      <label for="color-by-cred">color branch by credibility</label>
    </div>
  </div>
</div>
