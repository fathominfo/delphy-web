      <div class="mcc-display-options">
        <div class="mcc-opt-list trees">
          <form>
            <label class="trees--mcc">
              MCC
              <input type="radio" name="mcc-opt--trees" value="mcc" class="mcc-opt" checked />
            </label>
            <label class="trees--schematic">
              Schematic
              <input type="radio" name="mcc-opt--trees" value="schematic" class="mcc-opt" />
            </label>
            <label class="trees--base">
              Base
              <input type="radio" name="mcc-opt--trees" value="base" class="mcc-opt" />
            </label>
          </form>
        </div>


        <div class="mcc-opt-list color">
          <p>Color</p>
          <form>
            <label class="color--confidence">
              <span>Credibility</span>
              <input type="radio" name="color" value="confidence" class="mcc-opt" />
            </label>
            <div class="upload-metadata-msg">
              Upload metadata on the <a href="">customize</a> tab
            </div>
            <div class="metadata-list">
              <p>Metadata:</p>
            </div>
          </form>
        </div>

        <div class="mcc-credibility-opts">
          <div class="constrain-selection">
            <input type="checkbox" class="mcc--constrain-selection" />
            <label class="mcc--constrain-selection--label" for="mcc--constrain-selection">
              Only select credible branches
            </label>
          </div>
          <div class="mcc-opt-list confidence">
            <label >Credibility threshold <span class="mcc-opt--confidence-readout">90</span>%
              <div class="mcc-opt--confidence-range block-slider">
                <input type="range" min="1" max="100" value="90" step="1" class="slider--input"/>
                <div class="slider--track"></div>
                <div class="slider--track-filled"></div>
                <div class="slider--thumb"></div>
              </div>
            </label>
          </div>
        </div>
      </div>
